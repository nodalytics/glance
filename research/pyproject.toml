[project]
name = "poker-apis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=5.1.0.95",
    "fastapi>=0.121.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poker_apis"]

[project.scripts]
poker-apis = "poker_apis.main:main"
